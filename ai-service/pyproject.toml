[project]
name = "lexnexus-ai-service"
version = "0.1.0"
description = "律枢（LexNexus）独立 Agent 服务"
requires-python = ">=3.14,<3.15"
license-files = ["LICENSES/upstream-MIT.txt"]
dependencies = [
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.8"]
rag = [
    "milvus-lite==3.2.2",
    "pymilvus==3.0.2",
    "numpy>=2.4,<3",
    "sentence-transformers>=6.3,<7",
    "torch>=2.10,<3",
]
mysql = [
    "pymysql[rsa]==1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
